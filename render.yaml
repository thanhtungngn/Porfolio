services:
  - type: web
    name: portfolio-api
    runtime: docker
    dockerfilePath: ./Portfolio.Api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: OPENAI_API_KEY
        sync: false
      - key: ChatProviders__OpenAI__Endpoint
        value: https://api.openai.com/v1/chat/completions
      - key: ChatProviders__OpenAI__DefaultModel
        value: gpt-4o-mini
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: Mcp__Enabled
        value: "true"
      - key: Mcp__BaseUrl
        value: https://project-management-mcp.onrender.com
      - key: Mcp__ToolsPath
        value: /mcp
      - key: Mcp__ToolsHttpMethod
        value: POST
      - key: Mcp__InvokePathTemplate
        value: /mcp
      - key: Mcp__InvokeHttpMethod
        value: POST
      - key: Mcp__TimeoutSeconds
        value: "300"
      - key: Rag__OpenAiEmbedding__EmbeddingModel
        value: text-embedding-3-small
      - key: Rag__OpenAiEmbedding__EmbeddingEndpoint
        value: https://api.openai.com/v1/embeddings
      - key: Rag__Qdrant__Host
        sync: false
      - key: Rag__Qdrant__Port
        value: "6334"
      - key: Rag__Qdrant__Https
        sync: false
      - key: Rag__Qdrant__ApiKey
        sync: false
      - key: Rag__Qdrant__CollectionName
        value: portfolio

  - type: web
    name: portfolio-web
    runtime: static
    buildCommand: cd portfolio-web && npm install && npm run build
    staticPublishPath: ./portfolio-web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false