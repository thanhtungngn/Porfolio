services:
  - type: web
    name: portfolio-api
    runtime: docker
    dockerfilePath: ./Portfolio.Api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: Rag__Qdrant__Host
        sync: false
      - key: Rag__Qdrant__Port
        value: "6334"
      - key: Rag__Qdrant__Https
        sync: false
      - key: Rag__Qdrant__ApiKey
        sync: false
      - key: Rag__Qdrant__CollectionName
        value: portfolio

  - type: web
    name: portfolio-web
    runtime: static
    buildCommand: cd portfolio-web && npm install && npm run build
    staticPublishPath: ./portfolio-web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false