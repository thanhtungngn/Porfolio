name: ci

on:
  push:
    branches: ["main", "copilot/**", "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Portfolio.slnx

      - name: Build
        run: dotnet build Portfolio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Portfolio.Tests/Portfolio.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: portfolio-web
        run: npm install

      - name: Build frontend
        working-directory: portfolio-web
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Build API image
        run: docker build -f Portfolio.Api/Dockerfile -t portfolio-api:ci .
